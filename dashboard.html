<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard | AI Footprint</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                "colors": {
                        "primary": "#012d1d",
                        "secondary": "#4c6455",
                        "surface": "#f8f9ff",
                        "on-surface": "#0d1c2f",
                        "on-surface-variant": "#414844",
                        "surface-container-low": "#eff4ff",
                        "surface-container": "#e6eeff",
                        "surface-container-high": "#dde9ff",
                        "surface-container-highest": "#d5e3fd",
                        "primary-container": "#1b4332",
                        "on-primary": "#ffffff",
                        "secondary-container": "#cbe6d4",
                        "on-secondary-container": "#506859",
                        "outline-variant": "#c1c8c2",
                        "primary-fixed": "#c1ecd4",
                        "primary-fixed-dim": "#a5d0b9"
                },
                "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                }
              },
            }
          }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); }
    </style>
    <script>
        // Protect Route
        if (!localStorage.getItem('bf_user')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
    <!-- Header -->
    <header class="fixed top-0 w-full bg-emerald-50/80 backdrop-blur-md z-50 border-b border-outline-variant/10">
        <div class="flex justify-between items-center px-8 py-4 max-w-screen-xl mx-auto">
            <a href="index.html" class="flex items-center gap-2">
                <span class="material-symbols-outlined text-primary-fixed-dim" data-icon="energy_savings_leaf">energy_savings_leaf</span>
                <span class="text-xl font-bold text-emerald-900 font-headline tracking-tight">AI Footprint</span>
            </a>
            <div class="flex items-center gap-6">
                <nav class="hidden md:flex items-center gap-8">
                    <a class="text-emerald-700 font-semibold transition-colors font-headline" href="index.html">Calculator</a>
                </nav>
                <button onclick="handleLogout()" class="text-sm font-semibold text-error hover:opacity-80 transition-opacity flex items-center gap-1">
                    <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>Logout
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center pt-32 pb-12 px-6">
        <div class="max-w-3xl w-full space-y-8">
            <div class="space-y-2">
                <h1 class="text-3xl md:text-4xl font-headline font-extrabold text-primary" id="welcome-message">Welcome</h1>
                <p class="text-secondary font-body">Here is the environmental impact of your past activities.</p>
            </div>
            
            <div class="glass-card p-6 md:p-8 rounded-xl shadow-sm border border-outline-variant/15 space-y-6">
                <div class="flex items-center justify-between border-b border-outline-variant/15 pb-4">
                    <h2 class="font-headline font-bold text-xl text-primary flex items-center gap-2">
                        <span class="material-symbols-outlined">history</span> Activity History
                    </h2>
                    <a href="index.html" class="text-xs font-semibold px-3 py-1.5 bg-primary-container text-on-primary rounded-lg hover:opacity-90 transition-opacity">New Calculation</a>
                </div>
                
                <div id="history-list" class="space-y-4">
                    <!-- History injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const userName = localStorage.getItem('bf_user') || 'User';
            document.getElementById('welcome-message').innerText = `Welcome, ${userName}!`;
            
            const historyList = document.getElementById('history-list');
            const historyStr = localStorage.getItem('bf_history');
            let history = [];
            
            if (historyStr) {
                try {
                    history = JSON.parse(historyStr);
                } catch(e) {}
            }
            
            if (history.length === 0) {
                historyList.innerHTML = `<p class="text-sm text-on-surface-variant italic py-4">No recent activity found. Head to the calculator to get started!</p>`;
                return;
            }
            
            // Show last 10
            const recentHistory = history.slice(-10).reverse();
            
            let html = '';
            recentHistory.forEach((item) => {
                const dateOpts = { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' };
                const date = new Date(item.date).toLocaleString(undefined, dateOpts);
                html += `
                    <div class="p-4 bg-surface-container rounded-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:shadow-md transition-shadow">
                        <div class="space-y-1">
                            <p class="text-sm font-semibold text-primary">You used <span class="font-bold font-headline text-lg">${item.energy.toFixed(3)} kWh</span></p>
                            <p class="text-xs text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">calendar_today</span> ${date}</p>
                        </div>
                        <div class="flex items-center gap-3 text-xs font-medium text-secondary bg-surface-container-low px-3 py-1.5 rounded-full border border-outline-variant/20">
                            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">chat_bubble</span> ${item.text_prompts}</span>
                            <span class="w-[1px] h-3 bg-outline-variant/50"></span>
                            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">image</span> ${item.image_prompts}</span>
                        </div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        });

        function handleLogout() {
            localStorage.removeItem('bf_user');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
